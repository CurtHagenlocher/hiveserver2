# Pulls in the shared ADBC Driver Foundry release tooling (adbc-gen-package,
# adbc-release) so this repo's release assets match the other Foundry drivers.
#
# Unlike the Go and Rust drivers, this file is hand-maintained: adbc-gen-workflow
# in adbc-drivers/dev has no C# template yet, so there is nothing to regenerate
# it from. Keep it in sync with adbc-drivers/spark's go/pixi.toml by hand.

[workspace]
authors = ["ADBC Drivers Contributors"]
channels = ["conda-forge"]
name = "adbc-driver-hiveserver2"
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]
version = "0.24.0"

[tasks]
release = "adbc-release"

[dependencies]
python = ">=3.14.3,<3.15"

[pypi-dependencies]
adbc-drivers-dev = { git = "https://github.com/adbc-drivers/dev" }
